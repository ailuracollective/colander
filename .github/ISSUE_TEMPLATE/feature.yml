name: Feature
description: A change that adds capability to the crate.
title: 'feat: '
labels: [feat]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What should exist once this is done, and why.
    validations:
      required: true

  - type: dropdown
    id: abi-impact
    attributes:
      label: C ABI impact
      description: The C ABI is a versioned public contract. Say how this feature touches it.
      options:
        - No ABI change
        - Adds an entry point
        - Changes an existing entry point or the envelope shape
        - Removes or renames an entry point
        - Not sure yet
    validations:
      required: true

  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Technical rules the implementation must respect, such as the three runtime dependencies or the hand-written JSON parser and writer.
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: One testable statement per line, each starting with a dash.
      placeholder: |
        - The new entry point returns an `ok:true` envelope for a valid request.
        - `cargo clippy --all-targets -- -D warnings` exits 0.
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        `include/colander.h` is generated by cbindgen from `cbindgen.toml`.
        Any change to the ABI surface must regenerate the header, and that
        regeneration travels with the feature so the header and the crate never
        disagree.

  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What this explicitly does not cover, so the boundary is clear.
      placeholder: |
        - The `@ailuracode/colander` binding, which lives in its own repository.
    validations:
      required: false
