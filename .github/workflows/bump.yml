name: Bump

on:
  push:
    branches: [master]
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview the next version without creating anything'
        required: false
        type: boolean
        default: false
      version:
        description: 'Force a version (for example 0.2.0); empty means automatic'
        required: false
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: bump-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_MAKE_VERSION: "0.37.24"

jobs:
  bump:
    name: Open the version pull request
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Install cargo-make
        run: |
          archive="cargo-make-v${CARGO_MAKE_VERSION}-x86_64-unknown-linux-gnu"
          curl -sSL -o cargo-make.zip \
            "https://github.com/sagiegurari/cargo-make/releases/download/${CARGO_MAKE_VERSION}/${archive}.zip"
          unzip -q cargo-make.zip
          install -m 755 "${archive}/cargo-make" "${HOME}/.cargo/bin/cargo-make"
          install -m 755 "${archive}/makers" "${HOME}/.cargo/bin/makers"
          rm -rf cargo-make.zip "${archive}"
          cargo make --version

      - name: Install dprint
        run: |
          curl -fsSL -o dprint.zip \
            https://github.com/dprint/dprint/releases/download/0.57.4/dprint-x86_64-unknown-linux-gnu.zip
          unzip -q dprint.zip
          install -m 755 dprint "${HOME}/.cargo/bin/dprint"
          rm dprint.zip dprint
          dprint --version

      - name: Install cocogitto
        run: |
          archive="cocogitto-7.0.0-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o cog.tar.gz \
            "https://github.com/cocogitto/cocogitto/releases/download/7.0.0/${archive}"
          tar -xzf cog.tar.gz --strip-components=1 \
            x86_64-unknown-linux-musl/cog
          install -m 755 cog "${HOME}/.cargo/bin/cog"
          rm -f cog.tar.gz cog
          cog --version

      - name: Install cbindgen
        run: |
          curl -fsSL -o cbindgen \
            https://github.com/mozilla/cbindgen/releases/download/0.29.4/cbindgen-ubuntu22.04
          install -m 755 cbindgen "${HOME}/.cargo/bin/cbindgen"
          rm -f cbindgen
          cbindgen --version

      - name: Configure the bot identity
        # The bump creates the `chore(version)` commit, which needs an author.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync master and the tags
        run: |
          git fetch origin master --tags --quiet
          git reset --hard origin/master

      - name: Guard against a redundant bump
        run: |
          head_subject=$(git log -1 --pretty=%s origin/master)
          case "${head_subject}" in
            "chore(version):"*)
              echo "::notice::master already ends with '${head_subject}'; the tag job owns that version."
              echo "SKIP_BUMP=1" >> "${GITHUB_ENV}"
              ;;
          esac
          open=$(gh pr list --base master --state open --limit 100 \
            --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("chore/version-"))] | length')
          if [ "${open}" -ne 0 ]; then
            echo "::notice::A version pull request is already open; skipping."
            echo "SKIP_BUMP=1" >> "${GITHUB_ENV}"
          fi
          echo "SKIP_BUMP=${SKIP_BUMP:-0}" >> "${GITHUB_ENV}"

      - name: Bump
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ "${SKIP_BUMP}" = "1" ]; then
            echo "Nothing to bump." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "### Bump preview" >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
            cargo make bump-dry-run >> "${GITHUB_STEP_SUMMARY}"
            echo '```' >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          if [ -n "${VERSION:-}" ]; then
            # The one command line not delegated to `cargo make`, because
            # `cog bump --version` takes a value and the task is argument-free.
            cog bump --version "${VERSION}" --hook-profile ci
          else
            cog bump --auto --hook-profile ci
          fi
          # Cargo.toml is the single version source (scripts/bump-version.sh), so
          # it is what says which version this bump produced.
          version=$(sed -ne 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ -z "${version}" ]; then
            echo "::error::could not read the bumped version from Cargo.toml"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "### Bumped to \`${version}\`" >> "${GITHUB_STEP_SUMMARY}"

      - name: Open the version pull request
        if: steps.bump.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          branch="chore/version-${VERSION}"
          # cocogitto tagged the pre-merge commit. The `tag` job makes the real
          # tag on the merge commit, so drop the wrong one here rather than leave
          # it one push away from origin.
          git tag -d "v${VERSION}" || true
          git branch "${branch}"
          git push origin "${branch}"
          # The body goes through a file: a multi-line --body argument is a YAML
          # quoting problem, and a quoted heredoc keeps the shell out of it.
          body="${RUNNER_TEMP}/version-pr-body.md"
          cat > "${body}" <<'BODY'
          Automated version bump to `vVERSION_PLACEHOLDER`.

          `Cargo.toml` carries the single version source and `CHANGELOG.md` is
          generated by cocogitto; both were written by `cog bump --hook-profile ci`.

          Merging this pull request makes the merge commit the release commit. The
          `tag` job of this workflow then creates and pushes the tag on it, so do
          not create the tag by hand.
          BODY
          # The heredoc is quoted, so `${VERSION}` is left literal above; the only
          # substitution wanted is the version itself.
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/" "${body}"
          gh pr create \
            --base master \
            --head "${branch}" \
            --title "chore(version): v${VERSION}" \
            --body-file "${body}"
          echo "Opened the pull request for v${VERSION}."

      - name: Report the outcome
        run: |
          version="${{ steps.bump.outputs.version }}"
          if [ -z "${version}" ]; then
            echo "No version was bumped: the commits since the last tag did not require one."
            exit 0
          fi
          echo "Opened the pull request for v${version}."

  tag:
    name: Tag the release commit
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'chore/version-')
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the merge commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Create and push the tag
        env:
          GH_TOKEN: ${{ github.token }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # The title is `chore(version): vX.Y.Z`.
          tag=$(printf '%s' "${PR_TITLE}" | sed -n 's/^chore(version): \(v[0-9][0-9.]*\)$/\1/p')
          if [ -z "${tag}" ]; then
            echo "::notice::'${PR_TITLE}' is not a version title; nothing to tag."
            exit 0
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "::notice::${tag} already exists on origin; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${tag}" -m "${tag}"
          git push origin "${tag}"
          echo "### Pushed ${tag}" >> "${GITHUB_STEP_SUMMARY}"
          echo "The tag is on the merge commit. Its push runs the full ci.yml verification and does not create a GitHub Release."
