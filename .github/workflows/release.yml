# Release workflow: fires on the version tag pushed by `cog bump`'s post-bump
# hooks (a v* tag on master). It verifies the tree with the full CI task set,
# builds the cdylib and creates the GitHub Release with changelog notes and the
# built artifact.
#
# Publishing to crates.io is intentionally NOT part of this workflow (see
# docs/releases.md): it stays a manual, human decision run locally from a clean
# checkout. The version commit and tag were created locally by `cog bump` (the
# post-bump hooks only push), so this workflow only verifies and releases.

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_MAKE_VERSION: "0.37.24"

jobs:
  release:
    name: Verify and release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal \
            --component rustfmt --component clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Install cargo-make
        run: |
          archive="cargo-make-v${CARGO_MAKE_VERSION}-x86_64-unknown-linux-gnu"
          curl -sSL -o cargo-make.zip \
            "https://github.com/sagiegurari/cargo-make/releases/download/${CARGO_MAKE_VERSION}/${archive}.zip"
          unzip -q cargo-make.zip
          install -m 755 "${archive}/cargo-make" "${HOME}/.cargo/bin/cargo-make"
          install -m 755 "${archive}/makers" "${HOME}/.cargo/bin/makers"
          rm -rf cargo-make.zip "${archive}"
          cargo make --version

      - name: Install dprint
        run: |
          curl -fsSL -o dprint.zip \
            https://github.com/dprint/dprint/releases/download/0.57.4/dprint-x86_64-unknown-linux-gnu.zip
          unzip -q dprint.zip
          install -m 755 dprint "${HOME}/.cargo/bin/dprint"
          rm dprint.zip dprint
          dprint --version

      - name: Run the CI task set
        run: cargo make ci

      - name: Build the native library
        run: cargo build --release

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_FILE: /tmp/release-notes
        run: |
          VERSION="$GITHUB_REF_NAME"
          sh scripts/release-notes.sh "$VERSION" > "$NOTES_FILE"
          gh release create "$VERSION" \
            --title "colander $VERSION" \
            --notes-file "$NOTES_FILE" \
            target/release/libcolander.so