name: Contribution policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  issues:
    types: [opened]

permissions: {}

concurrency:
  group: policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-validation:
    name: Branch name

    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - uses: ailuracollective/actions/branch-validation@v2
        with:
          enable-status-comment: false
          branch-types: feat,fix,docs,chore,refactor,test,ci,build,perf
          skip-actors: 'AiluraKitty'

  pull-request-policy:
    name: Pull request policy

    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.state == 'open'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - uses: ailuracollective/actions/pull-request@v2
        with:
          enable-status-comment: false
          type-labels: type/feature,type/bug,type/documentation,type/improvement,type/task
          title-types: feat,fix,docs,chore,refactor,test,ci,build,perf,breaking-change
          title-min: '15'
          title-max: '72'
          linked-issue-sources: github
          approved-label: status/ready
          default-template: .github/pull_request_template.md
          skip-actors: 'AiluraKitty'

  triage:
    name: Issue triage
    if: github.event_name == 'issues'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: ailuracollective/actions/triage@v2
        with:
          auto-label-name: status/needs-review
