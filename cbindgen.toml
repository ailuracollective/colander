language = "C"
include_guard = "COLANDER_H"
pragma_once = true
autogen_warning = "/* Generated by cbindgen from colander - do not edit by hand. */"
tab_width = 4
documentation = true
documentation_style = "doxy"
usize_is_size_t = true
cpp_compat = false

after_includes = """
/*
 * colander: the form core, C ABI v1.
 *
 * Every function takes one NUL-terminated UTF-8 JSON request string (or NULL)
 * and returns a NUL-terminated UTF-8 JSON envelope owned by the caller. Release
 * it with colander_free_string(); it must never be passed to free().
 *
 *   success: {"ok":true,"result":{...}}
 *   failure: {"ok":false,"error":{"kind":"invalid_request|validation|panic",
 *                                 "message":"..."}}
 *
 * A NULL, non-UTF-8 or non-object request yields kind "invalid_request"; a
 * payload the core rejects yields "validation"; a contained Rust panic yields
 * "panic". No function ever unwinds into the caller, and no function returns
 * NULL.
 *
 * Requests (all keys are camelCase):
 *
 *   colander_compile
 *     {"formSchemaJson":"<json>","uiSchemaJson":"<json>|null",
 *      "rulesSchemaJson":"<json>|null",
 *      "components":[{"code":"...","version":"1.0.0",
 *                     "formSchemaJson":"<json>",
 *                     "uiSchemaJson":"<json>|null",
 *                     "contentHash":"<hex>|null"}]}
 *     -> {"formSchemaJson":"<json>","uiSchemaJson":"<json>|null",
 *         "rulesSchemaJson":"<json>|null",
 *         "dependencyMetadataJson":"<json>","contentHash":"<hex>"}
 *
 *   colander_evaluate_rules
 *     {"formSchemaJson":"<json>","rulesSchemaJson":"<json>",
 *      "uiSchemaJson":"<json>|null","values":{...}}
 *     -> {"visibility":{},"enabled":{},"required":{},
 *         "calculatedValues":{},"validationErrors":[{"code","message"}]}
 *
 *   colander_validate_response
 *     {"formSchemaJson":"<json>","uiSchemaJson":"<json>|null",
 *      "rulesSchemaJson":"<json>|null","answersJson":"<json>",
 *      "mode":"Draft"|"Complete"}
 *     -> {"normalizedAnswersJson":"<json>",
 *         "errors":[{"code","path","message"}],"isValid":bool}
 *
 *   colander_validate_schema
 *     colander ships no schemas: "schemas" carries the JSON Schema text for the
 *     document kinds the call validates, and is required for each kind used.
 *
 *     {"kind":"form"|"component"|"workflow","formSchemaJson":"<json>",
 *      "uiSchemaJson":"<json>|null","rulesSchemaJson":"<json>|null",
 *      "workflowSchemaJson":"<json>",
 *      "schemas":{"formSchema":"<json schema>","uiSchema":"<json schema>",
 *                 "rulesSchema":"<json schema>","workflowSchema":"<json schema>"}}
 *     -> {"valid":true}
 *
 *     The domain-free entry point validates any instance against any schema:
 *     {"kind":"instance","schemaJson":"<json schema>","instanceJson":"<json>",
 *      "label":"instance"}  -> {"valid":true}
 *
 *   colander_content_hash
 *     {"formSchemaJson":"<json>","uiSchemaJson":"<json>|null",
 *      "rulesSchemaJson":"<json>|null"}
 *     -> {"contentHash":"<sha256 hex>"}
 *
 *   colander_next_version
 *     {"published":["1.0.0", ...]}  -> {"next":"1.0.1"}
 *
 *   colander_version_info  {}  -> {"name","version","abi"}
 */
"""

[export]
include = ["colander_compile", "colander_evaluate_rules", "colander_validate_response",
           "colander_validate_schema", "colander_content_hash", "colander_next_version",
           "colander_version_info", "colander_abi_version", "colander_free_string"]
exclude = ["colander_alloc", "colander_free_buffer"]

[export.rename]
"c_char" = "char"

[parse]
parse_deps = false
